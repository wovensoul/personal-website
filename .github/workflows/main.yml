name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # pdflatex, the same engine Overleaf uses by default.
      - name: Build resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: resume

      - name: Add resume to site
        run: cp resume/main.pdf site/resume.pdf

      # The rest of the site is plain static files in site/.
      # Pushes to main go to production; pull requests get a preview URL for their branch.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=personal-website --branch=${{ github.head_ref || github.ref_name }}
